name: Lighthouse Accessibility Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Serve dist
        run: npx http-server ./dist -p 8080 &

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Lighthouse (accessibility)
        env:
          CHROME_PATH: /opt/hostedtoolcache/setup-chrome/chromium/stable/x64/chrome
        run: |
          # Run Lighthouse and capture stdout JSON (if produced) and stderr into a log
          npx -y lighthouse "http://127.0.0.1:8080/" \
            --preset=desktop \
            --only-categories=accessibility \
            --output=json --output-path=lh-accessibility.json \
            --chrome-flags="--no-sandbox --disable-gpu --headless=new" 2> lh-error.log || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-accessibility
          path: |
            lh-accessibility.json
            lh-error.log
